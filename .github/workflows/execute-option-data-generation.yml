# .github/workflows/daily_excel.yml
name: Generate Excel Daily

on:
  schedule:
    - cron: "0 2 * * *" # Runs every day at 2 AM UTC
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run the Excel generation script
        run: |
          python create-option-data.py

      - name: Commit and push updated Excel file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add option-data/*.xlsx
          git commit -m "Auto-update Excel on $(date)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
